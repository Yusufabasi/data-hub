[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-hub"
version = "0.1.0"
description = "Role-based data hub with a read-only natural-language question box"
requires-python = ">=3.11"
dependencies = [
    "sqlglot>=25",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
data-hub-seed = "data_hub.seed:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_hub = ["schema.sql", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
